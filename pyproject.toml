[project]
name = "sk-common"
version = "0.1.1"
description = "Общая основа школьных сервисов гимназии: вход через SkolStream и по email, справочник людей, журнал действий"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.2,<3",
    "httpx>=0.28,<1",
    "SQLAlchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "redis>=5.0,<6",
    "arq>=0.26,<1",
    "pyjwt>=2.10,<3",
    "aiosmtplib>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sk_common"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
